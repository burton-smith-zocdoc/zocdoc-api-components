<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Powered by Zocdoc — one element</title>
    <!--
      An empty data URL, so the browser asks for no favicon at all. Without it the console carries a
      failed request on every load, which is noise on a page whose claim is that nothing leaves it.
    -->
    <link rel="icon" href="data:," />
  </head>
  <body>
    <!--
      Dark mode is one setting that is either on or off, which is what a switch is for: the label
      stays put and the control carries the state, so nothing has to be relabelled as it flips.
      `appearance.ts` sets its starting position from the scheme the page opens in.

      The label is slotted rather than passed as the `label` attribute so the words sit in a DOM
      text node, where a browser's translator can reach them (I18N-001).
    -->
    <header class="page-header">
      <h1>One tag</h1>
      <div class="page-controls">
        <div id="theme-switcher" class="theme-switcher"></div>
        <zd-switch id="appearance" label-position="start">
          <span slot="label">Dark mode</span>
        </zd-switch>
      </div>
    </header>
    <p class="lede">The whole booking funnel from a single custom element.</p>

    <p id="mode"></p>

    <!--
      The `<h1>` above is the page's, which is why `zd-booking-flow` heads each of its steps at
      `<h2>`. A host page that gave this component the page's only heading would have a document
      whose outline starts at level two.

      `modal` keeps the search and its results on the page and runs the booking in a dialog over
      them, which is the arrangement a results page wants. Drop the attribute and the same steps
      render in place instead — see `/composed.html` for that one.
    -->
    <zd-booking-flow modal show-photos zip-code="11201"></zd-booking-flow>

    <section class="scenarios">
      <h2>Try a different outcome</h2>
      <p>Search with one of these ZIP codes:</p>
      <dl id="scenarios"></dl>
      <p><a href="/composed.html">See the same five components wired by hand</a></p>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
