name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # Builds dist/bundle/zocdoc.js, which the demo's standalone.html loads directly.
      - run: pnpm --filter @powered-by-zocdoc/api-components build:bundle

      - run: pnpm --filter demo build

      - run: pnpm --filter docs build

      # Combine both sites into a single artifact: demo stays at the site root
      # (matching its existing base path), docs is nested under /docs.
      - name: Combine demo and docs output
        run: |
          mkdir -p packages/demo/dist/docs
          cp -r packages/docs/dist/. packages/demo/dist/docs/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
